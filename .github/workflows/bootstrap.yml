name: Publicar e compilar EK Save Editor
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  publish-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto Android do pacote inicial
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/ek-source.tar.xz.base64 > /tmp/ek-source.tar.xz
          tar -xJf /tmp/ek-source.tar.xz
          base64 --decode .bootstrap/ek-v03.delta.b64 > /tmp/ek-v03.tar.xz
          tar -xJf /tmp/ek-v03.tar.xz
          cat .bootstrap/ek-v04.part{1..6} | base64 --decode > /tmp/ek-v04.tar.xz
          echo "471484ad237fcf11a17b19d37703cc638fc3e7e9e8b5462291fdffe0ea2f2b0b  /tmp/ek-v04.tar.xz" | sha256sum -c -
          tar -xJf /tmp/ek-v04.tar.xz
          python3 tools/generate_catalog.py
          test "$(grep -cv '^#' app/src/main/assets/ek_items.tsv)" -ge 520
          rm -f app/src/main/java/com/ekeditor/app/EkFileUserService.kt
          rm -f app/src/main/aidl/com/ekeditor/app/IEkFileService.aidl
          rm -f .github/workflows/android.yml
          test -f app/build.gradle.kts
          ! grep -q 'dev.rikka.shizuku' app/build.gradle.kts
          git add -A README.md TESTES.md app build.gradle.kts settings.gradle.kts gradle.properties tools catalogo
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "EK Save Editor v0.4: catalogo, companheiros, todos os saves e rotacao"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar ferramentas Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/ek-android
          mv /tmp/ek-android/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Executar testes e compilar APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: EKSaveEditor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
