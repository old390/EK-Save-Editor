name: Build, test, and release EK Save Editor

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
      - 'app/**'
      - 'RELEASE_NOTES.md'

permissions:
  contents: write

jobs:
  publish-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Android project files
        run: |
          test -f app/src/main/java/com/ekeditor/app/MainActivity.kt
          test -f app/src/main/java/com/ekeditor/app/EkBackup.kt
          test -f app/src/main/java/com/ekeditor/app/VaultStorage.kt
          test -f app/src/main/java/com/ekeditor/app/ItemRules.kt
          test -f app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/ek-android
          mv /tmp/ek-android/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests and build Android APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EKSaveEditor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish v0.8.0 GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [[ "$VERSION" != "0.8.0" ]]; then
            echo "Current version is $VERSION; v0.8.0 release step skipped."
            exit 0
          fi
          TAG="v$VERSION"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/debug/EK-Save-Editor-v0.8.0-debug.apk"
          cp "$APK" "$RELEASE_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Asset labels are not filenames; publish an actual renamed copy.
            gh release upload "$TAG" "$RELEASE_APK" --clobber
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "app-debug.apk"; then
              gh release delete-asset "$TAG" "app-debug.apk" --yes
            fi
          else
            gh release create "$TAG" "$RELEASE_APK" \
              --target "$GITHUB_SHA" \
              --title "EK Save Editor v0.8.0 - US English" \
              --notes-file RELEASE_NOTES.md
          fi
